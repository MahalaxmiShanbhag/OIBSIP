{% extends "layout.html" %}
{% block title %}#{{ room_name }} - ChatApp{% endblock %}

{% block content %}
<div class="row g-3">
    <!-- Sidebar -->
    <div class="col-12 col-lg-3">
        <div class="card shadow-sm border-0 rounded-4 mb-3">
            <div class="card-body p-3">
                <h6 class="fw-bold text-uppercase text-muted small mb-2">Room</h6>
                <h5 class="mb-0"><i class="bi bi-hash text-gradient"></i>{{ room_name }}</h5>
            </div>
        </div>
        <div class="card shadow-sm border-0 rounded-4 mb-3">
            <div class="card-body p-3">
                <h6 class="fw-bold text-uppercase text-muted small mb-2">
                    <i class="bi bi-people-fill me-1"></i>Online
                </h6>
                <h4 class="mb-0" id="onlineCount">1</h4>
                <small class="text-muted">user(s) in this room</small>
            </div>
        </div>
        <a href="{{ url_for('dashboard') }}" id="leaveRoomBtn" class="btn btn-outline-danger w-100 rounded-pill fw-semibold">
            <i class="bi bi-box-arrow-left me-1"></i> Leave Room
        </a>
    </div>

    <!-- Chat Panel -->
    <div class="col-12 col-lg-9">
        <div class="card shadow-sm border-0 rounded-4 chat-card">
            <div class="card-body p-0 d-flex flex-column">

                <!-- Messages area -->
                <div id="messages" class="chat-messages p-3 flex-grow-1"></div>

                <!-- Typing indicator -->
                <div id="typingIndicator" class="px-3 typing-indicator small text-muted"></div>

                <!-- Message input, fixed to bottom of the card -->
                <div class="chat-input-bar p-3 border-top">
                    <form id="messageForm" class="d-flex gap-2" autocomplete="off">
                        <input
                            type="text"
                            id="messageInput"
                            class="form-control rounded-pill px-3"
                            placeholder="Type a message... (try :fire: :heart: :rocket:)"
                            maxlength="500"
                            required
                        >
                        <button type="submit" class="btn btn-gradient rounded-circle send-btn" title="Send">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Socket.IO client library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
    // Data passed from Flask/Jinja into JavaScript
    const CURRENT_USERNAME = "{{ username }}";
    const CURRENT_ROOM = "{{ room_name }}";
</script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
