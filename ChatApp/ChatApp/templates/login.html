{% extends "layout.html" %}
{% block title %}Login - ChatApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card auth-card shadow-lg border-0 rounded-4 mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-chat-heart-fill display-4 text-gradient"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted">Log in to keep chatting</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Enter your username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 rounded-pill fw-semibold py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Login
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Don't have an account?
                    <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
