{% extends "layout.html" %}
{% block title %}Register - ChatApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="card auth-card shadow-lg border-0 rounded-4 mt-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill display-4 text-gradient"></i>
                    <h3 class="fw-bold mt-2">Create Account</h3>
                    <p class="text-muted">Join the conversation</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control rounded-pill px-3" placeholder="Choose a username" required autofocus minlength="3" maxlength="80">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control rounded-pill px-3" placeholder="Choose a password" required minlength="6">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control rounded-pill px-3" placeholder="Re-enter your password" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 rounded-pill fw-semibold py-2">
                        <i class="bi bi-check-circle me-1"></i> Register
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Already have an account?
                    <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
